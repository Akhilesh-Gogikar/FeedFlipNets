offline: true
data:
  name: 20newsgroups
  options:
    subset: all
    n_features: 4096
    svd_dim: 2048
    tfidf_max_features: 60000
    min_df: 2
    max_df: 0.95
    ngram_range: [1, 2]
    stop_words: english
    sublinear_tf: true
    seed: 13
    val_split: 0.2
    test_split: 0.2
model:
  hidden: [512, 256]
  quant: det
  strategy: dfa
train:
  seed: 13
  batch_size: 64
  epochs: 6
  eval_every: 1
  lr: 0.05
  optimizer: sgd
  flip: ternary
  flip_schedule: per_step
  run_dir: runs/20newsgroups-bow-mlp-dfa
