offline: true
data:
  name: synthetic
  options:
    freq: 3
    n_points: 256
    seed: 0
model:
  d_in: 1
  d_out: 1
  hidden: [16]
  quant: det
  tau: 0.05
  strategy: dfa
train:
  seed: 42
  batch_size: 16
  epochs: 3
  eval_every: 1
  lr: 0.02
  optimizer: sgd
  flip: ternary
  flip_schedule: per_step
  alignment_probe_steps: 25
  run_dir: runs/synthetic-mlp-dfa-align

