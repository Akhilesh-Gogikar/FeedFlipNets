offline: true
data:
  name: fashion_mnist
  options:
    seed: 11
    val_split: 0.1
    test_split: 0.2
    one_hot: true
model:
  hidden: [256, 256]
  quant: det
  strategy: dfa
train:
  seed: 11
  batch_size: 64
  epochs: 5
  eval_every: 1
  lr: 0.05
  optimizer: sgd
  flip: ternary
  flip_schedule: per_step
  alignment_probe_steps: 50
  run_dir: runs/fashion-mnist-mlp-dfa-align

