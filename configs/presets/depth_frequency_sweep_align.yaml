offline: true
sweep:
  methods: [dfa, backprop]
  depths: [1, 2]
  freqs: [2, 4]
  seeds: [0, 1]
  epochs: 1
  steps_per_epoch: 30
data:
  name: synthetic
  options:
    freq: 3
    n_points: 128
    seed: 0
model:
  d_in: 1
  d_out: 1
  hidden: [8]
  quant: det
  tau: 0.05
  strategy: dfa
train:
  batch_size: 16
  lr: 0.02
  enable_plots: false
  # Unique run_dir is set automatically per combination in pipelines._run_sweep
  alignment_probe_steps: 25

