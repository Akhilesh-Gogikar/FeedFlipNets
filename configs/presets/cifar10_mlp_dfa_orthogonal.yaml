offline: true
data:
  name: cifar10
  options:
    seed: 7
    val_split: 0.1
    test_split: 0.2
    one_hot: true
model:
  hidden: [512, 512]
  quant: det
  strategy: structured
  structure_type: orthogonal
  feedback_refresh: fixed
train:
  seed: 7
  batch_size: 64
  epochs: 5
  eval_every: 1
  lr: 0.05
  optimizer: sgd
  flip: ternary
  flip_schedule: per_step
  run_dir: runs/cifar10-mlp-dfa-orthogonal

